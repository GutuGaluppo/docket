<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72" role="img" aria-label="Docket">
  <title>Docket</title>
  <text x="0" y="52" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="700" font-size="54" letter-spacing="-1.6" fill="#E7E4D9">Docket</text>
  <!-- The signature stamp: double outline, violet, three degrees off square. -->
  <g transform="rotate(-3 268 36)">
    <rect x="238" y="14" width="60" height="44" rx="3" fill="none" stroke="#B292E8" stroke-width="2.5"/>
    <rect x="242" y="18" width="52" height="36" rx="2" fill="none" stroke="#B292E8" stroke-width="1"/>
    <text x="268" y="35" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace"
          font-weight="700" font-size="13" letter-spacing="0.5" fill="#B292E8">Nº</text>
    <line x1="246" y1="39" x2="290" y2="39" stroke="#B292E8" stroke-width="1"/>
    <text x="268" y="50" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace"
          font-weight="700" font-size="11" letter-spacing="1.4" fill="#B292E8">001</text>
  </g>
</svg>
